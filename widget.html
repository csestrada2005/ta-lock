<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaLock Widget Demo</title>
  <style>
    /* Host page styles — proves CSS isolation */
    body {
      font-family: Georgia, serif;
      background: #f0f0f0;
      margin: 0;
      padding: 2rem;
    }
    h1 { color: navy; }
    .widget-container {
      width: 100%;
      max-width: 500px;
      height: 700px;
      margin: 2rem auto;
      border: 2px dashed #ccc;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>Host Page — Widget Demo</h1>
  <p>The widget below is fully isolated inside a Shadow DOM.</p>

  <div class="widget-container">
    <ta-lock-widget tenant-id="talock"></ta-lock-widget>
  </div>

  <script>
    // Simulate LMS injecting config before the widget boots
    window.TaLockConfig = {
      tenantId: "demo-tenant",
      courseId: "demo-course-101",
      studentId: "student-demo-1",
      token: "demo-jwt-token",
      cohortId: "demo-cohort",
      term: "spring-2025",
      locale: "en-US",
      theme: {
        primary: "#800000",
        secondary: "#F1B82D",
        logoUrl: "",
        brandName: "TaLock Demo",
      },
    };
  </script>
  <script type="module" src="/src/widget.tsx"></script>
</body>
</html>
